format: custom
rfc9457: false
envelope:
  media_type: application/json
  schema:
    type: object
    properties:
      error: {type: string}
      message: {type: string}
  note: >-
    Everclear returns a flat {error, message} JSON object, not RFC 9457
    application/problem+json. There is no type URI, no instance, no trace/request id, and no
    machine-readable error code — an agent has to string-match the message. Three operations
    (POST /routes/quotes, POST /routes/limits, GET /history/{intentId}/invoice-processing)
    declare their 4xx/5xx responses with a description only and no schema at all, so even the
    envelope is not guaranteed there.
