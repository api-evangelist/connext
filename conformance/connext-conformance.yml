security_reviews_index: https://github.com/everclearorg/audits
certifications: []
compliance_program:
  published: false
  detail: >-
    No SOC 2, ISO 27001, PCI DSS, HIPAA, FedRAMP or GDPR posture page was published, and no
    trust center exists. The Immunefi bug bounty the docs advertise was never launched — the
    audits page says "Visit the Immunefi portal (Coming soon)" and "The active programs can be
    found here: Coming soon", and https://immunefi.com/bounty/connext/ returns HTTP 404.
