status: sunset
summary: >-
  Everclear (prev Connext) announced on 2026-05-21 that the protocol had been sunset, along
  with the Everclear Foundation and its labs/research arm. The published statement was "The
  protocol has been sunsetted. To our knowledge, no funds are stuck — any remaining TVL was
  withdrawn by users and partners." The developer documentation at docs.everclear.org is
  still served and still publishes the full OpenAPI, but every runtime host behind it is
  gone. This artifact records that gap so the archived contract in openapi/ is not mistaken
  for a callable API.
versioning:
  scheme: unversioned
  mechanism: >-
    No version segment in the path and no version header documented. The OpenAPI declares
    info.version 1.0.0 for the "Chimera API" and the servers[] entries carry no version
    prefix.
  current: '1.0.0'
  docs: https://docs.everclear.org/developers/api
deprecation:
  policy_url: null
  sunset_header: false
  notes: >-
    No deprecation policy, no RFC 8594 Sunset/Deprecation header support, and no advance
    notice mechanism was ever published. The protocol shutdown was announced on social media
    and the API host was taken offline; the documentation was not updated to say so.
