note: >-
  Everclear (prev Connext) never shipped a first-party client library for the Everclear
  ("Chimera") REST API — integrators call it over plain HTTP. The packages below are the
  first-party libraries published for the two protocol generations: the @connext/* scope
  (Connext Amarok / NXTP SDK, npm org "connext") and the @everclear-org/* scope (the
  Everclear contracts/chainservice packages, published from the chimera-monorepo built by
  Defi Wonderland). All are legacy: the Everclear protocol was sunset in May 2026 and the
  @everclear-org/* packages never left 0.0.1-alpha.
