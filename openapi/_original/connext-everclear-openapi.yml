  /solana/intents:
    post:
      summary: Create a new intent on Solana
      description: Submits a new intent transaction to the Solana blockchain using the specified parameters
        and configuration.
      operationId: callNewIntentSolana
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - origin
              - destinations
              - to
              - inputAsset
              - amount
              - callData
              - maxFee
              - user
              properties:
                origin:
                  type: string
                destinations:
                  type: array
                  items:
                    type: string
                  nullable: false
                to:
                  type: string
                from:
                  type: string
                  description: intent creator address
                inputAsset:
                  type: string
                amount:
                  type: string
                  format: bigint
                  description: Token amount, denominated in the asset's decimal units on the origin chain
                callData:
                  type: string
                maxFee:
                  type: string
                  format: bigint
                  description: Maximum fee amount, denominated in the asset's decimal units on the origin
                    chain
                user:
                  type: string
                userTokenAccountPublicKey:
                  type: string
                programVaultAccountPublicKey:
                  type: string
                permit2Params:
                  type: object
                  properties:
                    nonce:
                      type: string
                      format: bigint
                      description: Nonce as a bigint
                    deadline:
                      type: string
                      format: bigint
                      description: Deadline as a bigint
                    signature:
                      type: string
                  required:
                  - nonce
                  - deadline
                  - signature
                order_id:
                  type: string
                  description: Order ID for newOrder requests
      responses:
        '200':
          description: Successfully created intent transaction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionRequest'
        '400':
          description: Registries not found and deployed for given domain
          content:
            application/json:
